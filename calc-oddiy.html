<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oddiy kalkulyator</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.box {
  margin: auto;
  width: 92%;
  max-width: 340px;
  background: #ffffff;
  padding: 20px;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(79, 70, 229, 0.08);
  border: 1px solid #e2e8f0;
}
#ekran {
  width: 100%;
  height: 70px;
  background: #f8fafc;
  color: #1e293b;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  text-align: right;
  padding: 10px 16px;
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
button {
  padding: 16px 0;
  font-size: 20px;
  font-weight: 600;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  background: #f8fafc;
  color: #1e293b;
  transition: all 0.15s;
}
button:hover {
  background: #e2e8f0;
}
button:active {
  transform: scale(0.95);
}
.amal {
  background: #eef2ff;
  color: #4f46e5;
}
.toza {
  background: #fef2f2;
  color: #ef4444;
}
.teng {
  background: #4f46e5;
  color: #ffffff;
  grid-column: span 2;
}
.teng:hover {
  background: #4338ca;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <a href="index.html" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#4f46e5; text-decoration:none; background:#eef2ff; padding:6px 12px; border-radius:8px; font-size:14px; font-weight:600;">🏠 Asosiy</a>

  <h3>Oddiy kalkulyator</h3>
</header>

<div class="box">
  <input type="text" id="ekran" value="0" readonly>
  <div class="grid">
    <button class="toza" onclick="tozala()">C</button>
    <button class="toza" onclick="ochir()">⌫</button>
    <button class="amal" onclick="qosh('%')">%</button>
    <button class="amal" onclick="qosh('/')">÷</button>

    <button onclick="qosh('7')">7</button>
    <button onclick="qosh('8')">8</button>
    <button onclick="qosh('9')">9</button>
    <button class="amal" onclick="qosh('*')">×</button>

    <button onclick="qosh('4')">4</button>
    <button onclick="qosh('5')">5</button>
    <button onclick="qosh('6')">6</button>
    <button class="amal" onclick="qosh('-')">−</button>

    <button onclick="qosh('1')">1</button>
    <button onclick="qosh('2')">2</button>
    <button onclick="qosh('3')">3</button>
    <button class="amal" onclick="qosh('+')">+</button>

    <button onclick="qosh('0')">0</button>
    <button onclick="qosh('.')">.</button>
    <button class="teng" onclick="hisobla()">=</button>
  </div>
</div>

<script>
const ekran = document.getElementById('ekran');

function qosh(belgi) {
  if (ekran.value === '0' && belgi !== '.') {
    ekran.value = belgi;
  } else {
    ekran.value += belgi;
  }
}

function tozala() {
  ekran.value = '0';
}

function ochir() {
  ekran.value = ekran.value.slice(0, -1) || '0';
}

function hisobla() {
  try {
    let ifoda = ekran.value.replace(/%/g, '/100');
    let natija = eval(ifoda);
    ekran.value = Number.isInteger(natija) ? natija : parseFloat(natija.toFixed(6));
  } catch {
    ekran.value = 'Xato';
    setTimeout(tozala, 1200);
  }
}
</script>

</body>
</html>
