<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinematika (Harakat) kalkulyatori</title>
  <link rel="stylesheet" href="theme.css?v=2">
<script src="theme.js?v=2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.container {
  margin: 1.5rem auto;
  width: 94%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
}
.box {
  background: #ffffff;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 10px 25px rgba(79, 70, 229, 0.07);
  border: 1px solid #e2e8f0;
}
h4 {
  color: #312e81;
  margin-bottom: 10px;
  font-size: 1.1rem;
}
.hint {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 12px;
}
.inputs {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
input {
  width: 100%;
  padding: 11px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 15px;
  background: #f8fafc;
  text-align: center;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 14px;
  background: #eef2ff;
  padding: 12px 14px;
  border-radius: 12px;
  color: #1e293b;
  font-weight: 600;
  line-height: 1.6;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <a href="index.html" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#4f46e5; text-decoration:none; background:#eef2ff; padding:6px 12px; border-radius:8px; font-size:14px; font-weight:600;">🏠 Asosiy</a>

  <h3>Kinematika (Harakat)</h3>
</header>

<div class="container">

  <!-- 1. Tekis harakat -->
  <div class="box">
    <h4>1. Tekis harakat (s = v · t)</h4>
    <p class="hint">Istalgan 2 ta qiymatni kiriting, 3-sini bo'sh qoldiring:</p>
    <div class="inputs">
      <input type="number" id="s1" placeholder="s (m)" step="any">
      <input type="number" id="v1" placeholder="v (m/s)" step="any">
      <input type="number" id="t1" placeholder="t (s)" step="any">
    </div>
    <button class="btn" onclick="hisobTekis()">Topish</button>
    <div class="natija" id="res-tekis"></div>
  </div>

  <!-- 2. Tekis tezlanuvchan harakat -->
  <div class="box">
    <h4>2. Tekis tezlanuvchan harakat</h4>
    <p class="hint">Boshlang'ich tezlik, tezlanish va vaqtni kiriting:</p>
    <div class="inputs">
      <input type="number" id="v0" placeholder="v₀ (m/s)" step="any">
      <input type="number" id="a" placeholder="a (m/s²)" step="any">
      <input type="number" id="t2" placeholder="t (s)" step="any">
    </div>
    <button class="btn" onclick="hisobTezlanish()">Hisoblash</button>
    <div class="natija" id="res-tez"></div>
  </div>

</div>

<script>
function hisobTekis() {
  const sVal = document.getElementById('s1').value;
  const vVal = document.getElementById('v1').value;
  const tVal = document.getElementById('t1').value;
  const res = document.getElementById('res-tekis');
  res.style.display = 'block';

  const s = parseFloat(sVal);
  const v = parseFloat(vVal);
  const t = parseFloat(tVal);

  if (sVal === '' && !isNaN(v) && !isNaN(t)) {
    res.innerText = `Bosib o'tilgan yo'l: s = ${parseFloat((v * t).toFixed(6))} m`;
  } else if (vVal === '' && !isNaN(s) && !isNaN(t) && t !== 0) {
    res.innerText = `Tezlik: v = ${parseFloat((s / t).toFixed(6))} m/s`;
  } else if (tVal === '' && !isNaN(s) && !isNaN(v) && v !== 0) {
    res.innerText = `Vaqt: t = ${parseFloat((s / v).toFixed(6))} s`;
  } else {
    res.innerText = "Iltimos, faqat 2 ta qiymatni to'g'ri kiriting (bo'luvchi ≠ 0)!";
  }
}

function hisobTezlanish() {
  const v0 = parseFloat(document.getElementById('v0').value);
  const a = parseFloat(document.getElementById('a').value);
  const t = parseFloat(document.getElementById('t2').value);
  const res = document.getElementById('res-tez');
  res.style.display = 'block';

  if (isNaN(v0) || isNaN(a) || isNaN(t) || t < 0) {
    res.innerText = "Barcha qiymatlarni to'g'ri kiriting (t ≥ 0)!";
    return;
  }

  const v = v0 + a * t;
  const s = v0 * t + (a * t * t) / 2;

  res.innerHTML = `Oxirgi tezlik: v = ${parseFloat(v.toFixed(6))} m/s<br>Bosib o'tilgan yo'l: s = ${parseFloat(s.toFixed(6))} m`;
}
</script>

</body>
</html>
