<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foiz kalkulyatori</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.container {
  margin: 1.5rem auto;
  width: 94%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}
.box {
  background: #ffffff;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(79, 70, 229, 0.07);
  border: 1px solid #e2e8f0;
}
h4 {
  color: #312e81;
  margin-bottom: 12px;
  font-size: 1.05rem;
}
.row {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
input, select {
  width: 100%;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 15px;
  background: #f8fafc;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 12px;
  background: #eef2ff;
  padding: 10px 12px;
  border-radius: 10px;
  color: #312e81;
  font-weight: 700;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <h3>Foiz kalkulyatori</h3>
</header>

<div class="container">

  <!-- 1. Sonning foizini topish -->
  <div class="box">
    <h4>1. Sonning foizini topish</h4>
    <div class="row">
      <input type="number" id="s1" placeholder="Son (masalan: 250)" step="any">
      <input type="number" id="p1" placeholder="Foiz % (masalan: 20)" step="any">
    </div>
    <button class="btn" onclick="hisob1()">Hisoblash</button>
    <div class="natija" id="res1"></div>
  </div>

  <!-- 2. Nisbatni foizda topish -->
  <div class="box">
    <h4>2. Bir son ikkinchisining necha foizi?</h4>
    <div class="row">
      <input type="number" id="qism" placeholder="Qism (masalan: 24)" step="any">
      <input type="number" id="jami" placeholder="Jami (masalan: 30)" step="any">
    </div>
    <button class="btn" onclick="hisob2()">Hisoblash</button>
    <div class="natija" id="res2"></div>
  </div>

  <!-- 3. Foiz qo'shish yoki ayirish -->
  <div class="box">
    <h4>3. Songa foiz qo'shish / ayirish</h4>
    <div class="row">
      <input type="number" id="s3" placeholder="Asosiy son" step="any">
      <input type="number" id="p3" placeholder="Foiz %" step="any">
    </div>
    <select id="amal3" style="margin-bottom: 12px;">
      <option value="qosh">+ Foiz qo'shish (oshirish)</option>
      <option value="ayir">− Foiz ayirish (kamaytirish)</option>
    </select>
    <button class="btn" onclick="hisob3()">Hisoblash</button>
    <div class="natija" id="res3"></div>
  </div>

</div>

<script>
function hisob1() {
  const s = parseFloat(document.getElementById('s1').value);
  const p = parseFloat(document.getElementById('p1').value);
  const res = document.getElementById('res1');
  res.style.display = 'block';
  if (isNaN(s) || isNaN(p)) {
    res.innerText = "Iltimos, son va foizni kiriting!";
    return;
  }
  const nat = (s * p) / 100;
  res.innerText = `${s} ning ${p}% i = ${parseFloat(nat.toFixed(6))}`;
}

function hisob2() {
  const q = parseFloat(document.getElementById('qism').value);
  const j = parseFloat(document.getElementById('jami').value);
  const res = document.getElementById('res2');
  res.style.display = 'block';
  if (isNaN(q) || isNaN(j) || j === 0) {
    res.innerText = "Qiymatlarni to'g'ri kiriting (Jami ≠ 0)!";
    return;
  }
  const nat = (q / j) * 100;
  res.innerText = `${q} soni ${j} ning ${parseFloat(nat.toFixed(4))}% ini tashkil qiladi`;
}

function hisob3() {
  const s = parseFloat(document.getElementById('s3').value);
  const p = parseFloat(document.getElementById('p3').value);
  const amal = document.getElementById('amal3').value;
  const res = document.getElementById('res3');
  res.style.display = 'block';
  if (isNaN(s) || isNaN(p)) {
    res.innerText = "Iltimos, son va foizni kiriting!";
    return;
  }
  const ulush = (s * p) / 100;
  const nat = amal === 'qosh' ? s + ulush : s - ulush;
  res.innerText = `Natija: ${parseFloat(nat.toFixed(6))}`;
}
</script>

</body>
</html>
