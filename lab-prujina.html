<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 3: Prujinali mayatnik</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 14px 10px;
  text-align: center;
  position: relative;
}
header h3 { font-size: 1.2rem; }
.back, .home-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.back { left: 12px; }
.home-btn { right: 12px; }
.lab-container {
  max-width: 960px;
  width: 95%;
  margin: 1.2rem auto;
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 1.2rem;
}
@media (max-width: 780px) {
  .lab-container { grid-template-columns: 1fr; }
}
.box {
  padding: 16px;
  border-radius: 18px;
  border: 1px solid #e2e8f0;
}
canvas {
  width: 100%;
  border-radius: 12px;
  display: block;
  touch-action: none;
  cursor: grab;
}
canvas:active { cursor: grabbing; }
.graph-canvas {
  margin-top: 12px;
  cursor: default;
}
.control-group { margin-bottom: 13px; }
.control-header {
  display: flex;
  justify-content: space-between;
  font-size: 0.9rem;
  font-weight: 600;
  margin-bottom: 4px;
}
input[type="range"] { width: 100%; cursor: pointer; }
select {
  width: 100%;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #cbd5e1;
  font-size: 0.92rem;
  font-weight: 600;
}
.checks {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin: 10px 0 12px;
  font-size: 0.88rem;
  font-weight: 600;
}
.checks label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.btn-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
}
.btn-sec {
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
}
.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.metric-card {
  background: var(--surface-soft, #f8fafc);
  border: 1px solid var(--border, #e2e8f0);
  padding: 9px;
  border-radius: 10px;
  text-align: center;
}
.metric-card span {
  display: block;
  font-size: 0.76rem;
  opacity: 0.8;
}
.metric-card strong {
  font-size: 1rem;
  color: var(--accent, #4f46e5);
}
.formula-bar {
  font-size: 0.84rem;
  text-align: center;
  padding: 8px;
  border-radius: 10px;
  background: var(--surface-soft, #f8fafc);
  border: 1px solid var(--border, #e2e8f0);
  margin-bottom: 12px;
  font-weight: 600;
}
</style>
</head>
<body>

<header>
  <a href="fiz-laboratoriya.html" class="back">← Orqaga</a>
  <h3>3. Prujinali mayatnik</h3>
  <a href="index.html" class="home-btn">🏠 Asosiy</a>
</header>

<div class="lab-container">
  <div class="box">
    <canvas id="springCanvas" width="520" height="360"></canvas>
    <canvas id="graphCanvas" class="graph-canvas" width="520" height="130"></canvas>
  </div>

  <div class="box">
    <div class="formula-bar">T = 2π · √(m / k) &nbsp;|&nbsp; F<sub>el</sub> = −k · x &nbsp;|&nbsp; Yukni torting!</div>

    <div class="control-group">
      <div class="control-header"><span>Sayyora (g tezlanish):</span></div>
      <select id="planet">
        <option value="9.81">🌍 Yer (g = 9.81 m/s²)</option>
        <option value="1.62">🌕 Oy (g = 1.62 m/s²)</option>
        <option value="3.71">🔴 Mars (g = 3.71 m/s²)</option>
        <option value="0">🚀 Vaznsizlik (g = 0 m/s²)</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-header"><span>Prujina bikrligi (k):</span><span id="k-val">40 N/m</span></div>
   <input type="range" id="stiff" min="1" max="100" step="1" value="40">

    </div>

    <div class="control-group">
      <div class="control-header"><span>Yuk massasi (m):</span><span id="m-val">1.0 kg</span></div>
      <input type="range" id="mass" min="0.2" max="4.0" step="0.1" value="1.0">
    </div>

    <div class="control-group">
      <div class="control-header"><span>So'nish koeffitsiyenti:</span><span id="d-val">0.00</span></div>
      <input type="range" id="damping" min="0" max="1.5" step="0.05" value="0">
    </div>

    <div class="checks">
      <label><input type="checkbox" id="showVec" checked> Kuch vektorlari (F<sub>el</sub>, mg)</label>
      <label><input type="checkbox" id="showEq" checked> Muvozanat chizig'i</label>
    </div>

    <div class="btn-row">
      <button class="btn" id="playBtn">⏸️ Pauza</button>
      <button class="btn btn-sec" id="resetBtn">🔄 Qayta</button>
    </div>

    <div class="metrics">
      <div class="metric-card"><span>Tebranish davri (T)</span><strong id="m-period">0.99 s</strong></div>
      <div class="metric-card"><span>Chastota (ν)</span><strong id="m-freq">1.01 Hz</strong></div>
      <div class="metric-card"><span>Cho'zilish (Δx)</span><strong id="m-ext">0.25 m</strong></div>
      <div class="metric-card"><span>Elastiklik kuchi (F<sub>el</sub>)</span><strong id="m-force">9.81 N</strong></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('springCanvas');
const ctx = canvas.getContext('2d');
const graphCanvas = document.getElementById('graphCanvas');
const gctx = graphCanvas.getContext('2d');

let k = 40;
let m = 1.0;
let g = 9.81;
let damping = 0;

let y = 0.45; // cho'zilmagan nuqtadan pastga (metrda)
let vy = 0;
let running = true;
let dragging = false;
let history = new Array();
let lastTime = performance.now();

const anchorX = canvas.width / 2;
const anchorY = 30;
const restLenPx = 110;
const pxPerMeter = 220;

function getColors() {
  const s = getComputedStyle(document.documentElement);
  return {
    bg: s.getPropertyValue('--surface-soft').trim() || '#f8fafc',
    text: s.getPropertyValue('--text').trim() || '#1e293b',
    accent: s.getPropertyValue('--accent').trim() || '#4f46e5',
    border: s.getPropertyValue('--border').trim() || '#cbd5e1'
  };
}

function stepPhysics(dt) {
  const ay = g - (k / m) * y - (damping / m) * vy;
  vy += ay * dt;
  y += vy * dt;
}
function drawArrow(c, fromX, fromY, toX, toY, color, label) {
  if (Math.abs(toY - fromY) < 4) return;
  const headlen = 8;
  const angle = Math.atan2(toY - fromY, toX - fromX);
  c.save();
  c.strokeStyle = color;
  c.fillStyle = color;
  c.lineWidth = 2.4;
  c.beginPath();
  c.moveTo(fromX, fromY);
  c.lineTo(toX, toY);
  c.stroke();

  c.beginPath();
  c.moveTo(toX, toY);
  c.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
  c.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
  c.closePath();
  c.fill();

  if (label) {
    c.font = 'bold 12px Segoe UI, sans-serif';
    c.fillText(label, toX + 8, toY + 4);
  }
  c.restore();
}

function drawSpring(x, y1, y2, coils, width, lineW, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = lineW;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y1);
  const topStraight = 18;
  const botStraight = 18;
  ctx.lineTo(x, y1 + topStraight);

  const coilArea = (y2 - botStraight) - (y1 + topStraight);
  const step = coilArea / coils;

  for (let i = 0; i < coils; i++) {
    const cy = y1 + topStraight + step * i;
    ctx.lineTo(x - width, cy + step * 0.25);
    ctx.lineTo(x + width, cy + step * 0.75);
  }
  ctx.lineTo(x, y2 - botStraight);
  ctx.lineTo(x, y2);
  ctx.stroke();
  ctx.restore();
}

function drawSim() {
  const col = getColors();
  ctx.fillStyle = col.bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Shift tayanchi
  ctx.strokeStyle = col.border;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(anchorX - 90, anchorY);
  ctx.lineTo(anchorX + 90, anchorY);
  ctx.stroke();

  const restY = anchorY + restLenPx;
  const eqOffset = (m * g) / k;
  const eqY = restY + eqOffset * pxPerMeter;
  const bobY = restY + y * pxPerMeter;
  const boxSize = 36 + m * 6;

  // Muvozanat chiziqlari
  if (document.getElementById('showEq').checked) {
    ctx.save();
    ctx.setLineDash(new Array(5, 5));
    ctx.lineWidth = 1.4;
    ctx.font = '11px Segoe UI, sans-serif';

    // Cho'zilmagan chiziq (x0)
    ctx.strokeStyle = col.border;
    ctx.fillStyle = col.text;
    ctx.beginPath();
    ctx.moveTo(60, restY);
    ctx.lineTo(canvas.width - 60, restY);
    ctx.stroke();
    ctx.fillText('x₀ (bo\'sh)', 65, restY - 5);

    // Statik muvozanat chizig'i
    ctx.strokeStyle = '#10b981';
    ctx.fillStyle = '#10b981';
    ctx.beginPath();
    ctx.moveTo(60, eqY);
    ctx.lineTo(canvas.width - 60, eqY);
    ctx.stroke();
    ctx.fillText('Muvozanat', 65, eqY - 5);
    ctx.restore();
  }

  // Prujinani chizish
  const thickness = 1.8 + (k / 100) * 3;
  drawSpring(anchorX, anchorY, bobY - boxSize / 2, 12, 18, thickness, col.text);

  // Yuk (to'rtburchak blok)
  ctx.fillStyle = col.accent;
  ctx.beginPath();
  ctx.roundRect(anchorX - boxSize / 2, bobY - boxSize / 2, boxSize, boxSize, 10);
  ctx.fill();
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 12px Segoe UI, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(m.toFixed(1) + ' kg', anchorX, bobY + 4);
  ctx.textAlign = 'left';

  // Kuch vektorlari
  if (document.getElementById('showVec').checked) {
    const fScale = 2.4;
    const fel = k * y;
    const fg = m * g;
    drawArrow(ctx, anchorX + boxSize / 2 + 14, bobY, anchorX + boxSize / 2 + 14, bobY - Math.min(Math.max(fel * fScale, -90), 90), '#10b981', 'F_el');
    drawArrow(ctx, anchorX - boxSize / 2 - 14, bobY, anchorX - boxSize / 2 - 14, bobY + Math.min(fg * fScale, 90), '#ef4444', 'mg');
  }
}

function drawGraph() {
  const col = getColors();
  gctx.fillStyle = col.bg;
  gctx.fillRect(0, 0, graphCanvas.width, graphCanvas.height);

  const midY = graphCanvas.height / 2;
  gctx.strokeStyle = col.border;
  gctx.lineWidth = 1;
  gctx.beginPath();
  gctx.moveTo(0, midY);
  gctx.lineTo(graphCanvas.width, midY);
  gctx.stroke();

  gctx.fillStyle = col.text;
  gctx.font = '11px Segoe UI, sans-serif';
  gctx.fillText('Tebranish grafigi x(t)', 10, 16);

  if (history.length < 2) return;
  gctx.strokeStyle = col.accent;
  gctx.lineWidth = 2.2;
  gctx.beginPath();
  for (let i = 0; i < history.length; i++) {
    const gx = (i / 250) * graphCanvas.width;
    const gy = midY + history.at(i) * 85;
    if (i === 0) gctx.moveTo(gx, gy);
    else gctx.lineTo(gx, gy);
  }
  gctx.stroke();
}

function updateStats() {
  const T = 2 * Math.PI * Math.sqrt(m / k);
  const freq = 1 / T;
  const fel = Math.abs(k * y);

  document.getElementById('m-period').innerText = T.toFixed(2) + ' s';
  document.getElementById('m-freq').innerText = freq.toFixed(2) + ' Hz';
  document.getElementById('m-ext').innerText = y.toFixed(2) + ' m';
  document.getElementById('m-force').innerText = fel.toFixed(2) + ' N';
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  const eqY = (m * g) / k;

  if (running && !dragging) {
    const sub = 6;
    for (let i = 0; i < sub; i++) {
      stepPhysics(dt / sub);
    }
    history.push(y - eqY);
    if (history.length > 250) history.shift();
  }

  updateStats();
  drawSim();
  drawGraph();
  requestAnimationFrame(loop);
}

function getPointerY(e) {
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches ? e.touches.item(0) : e;
  return (touch.clientY - rect.top) * (canvas.height / rect.height);
}

function startDrag(e) {
  const py = getPointerY(e);
  const bobY = anchorY + restLenPx + y * pxPerMeter;
  if (Math.abs(py - bobY) < 45) {
    dragging = true;
    vy = 0;
  }
}

function moveDrag(e) {
  if (!dragging) return;
  e.preventDefault();
  const py = getPointerY(e);
  let newY = (py - (anchorY + restLenPx)) / pxPerMeter;
  newY = Math.max(-0.2, Math.min(0.85, newY));
  y = newY;
  vy = 0;
}

function endDrag() { dragging = false; }

canvas.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);

canvas.addEventListener('touchstart', startDrag, { passive: false });
window.addEventListener('touchmove', moveDrag, { passive: false });
window.addEventListener('touchend', endDrag);

document.getElementById('planet').addEventListener('change', (e) => { g = parseFloat(e.target.value); });
document.getElementById('stiff').addEventListener('input', (e) => {
  k = parseFloat(e.target.value);
  document.getElementById('k-val').innerText = k + ' N/m';
});
document.getElementById('mass').addEventListener('input', (e) => {
  m = parseFloat(e.target.value);
  document.getElementById('m-val').innerText = m.toFixed(1) + ' kg';
});
document.getElementById('damping').addEventListener('input', (e) => {
  damping = parseFloat(e.target.value);
  document.getElementById('d-val').innerText = damping.toFixed(2);
});

document.getElementById('playBtn').addEventListener('click', (e) => {
  running = !running;
  e.target.innerText = running ? '⏸️ Pauza' : '▶️ Boshlash';
});
document.getElementById('resetBtn').addEventListener('click', () => {
  y = (m * g) / k + 0.25;
  vy = 0;
  history = new Array();
});

requestAnimationFrame(loop);
</script>

</body>
</html>
