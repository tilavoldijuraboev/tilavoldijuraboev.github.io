<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INNOVA — Masalalar yechimlari</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<script src="innova-data.js?v=2"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
header {
  padding: 1.4rem 1rem;
  text-align: center;
  position: relative;
}
header h1 {
  font-size: 1.45rem;
  font-weight: 700;
}
.back-btn, .home-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
}
.back-btn { left: 15px; }
.home-btn { right: 15px; }

.container {
  max-width: 680px;
  width: 94%;
  margin: 2rem auto;
}
.bob-title {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--title, #312e81);
  margin: 1.2rem 0 0.8rem;
  padding-left: 8px;
  border-left: 4px solid var(--accent, #4f46e5);
}
.acc-item {
  background: var(--surface, #ffffff);
  border: 1px solid var(--border, #e2e8f0);
  border-radius: 14px;
  margin-bottom: 10px;
  overflow: hidden;
  box-shadow: 0 4px 12px var(--shadow, rgba(0,0,0,0.04));
}
.acc-header {
  width: 100%;
  text-align: left;
  padding: 14px 18px;
  background: transparent;
  border: none;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text, #1e293b);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.acc-header:hover {
  background: var(--accent-soft, #eef2ff);
}
.acc-body {
  display: none;
  padding: 14px 18px 18px;
  border-top: 1px solid var(--border, #e2e8f0);
  background: var(--surface-soft, #f8fafc);
}
.acc-body.open {
  display: block;
}
.num-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 8px;
}
.num-btn {
  padding: 10px 6px;
  border: 1px solid var(--border, #cbd5e1);
  border-radius: 10px;
  background: var(--surface, #ffffff);
  color: var(--accent, #4f46e5);
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.15s;
}
.num-btn:hover {
  background: var(--accent, #4f46e5);
  color: #ffffff;
  transform: translateY(-2px);
}

/* Modal oyna */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.show {
  display: flex;
}
.modal-card {
  background: var(--surface, #ffffff);
  color: var(--text, #1e293b);
  border: 1px solid var(--border, #e2e8f0);
  max-width: 540px;
  width: 100%;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}
.modal-badge {
  display: inline-block;
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 12px;
}
.modal-sec {
  margin-bottom: 14px;
  line-height: 1.6;
}
.modal-sec-title {
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  opacity: 0.75;
  font-weight: 700;
  margin-bottom: 4px;
}
.ans-box {
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  padding: 12px 14px;
  border-radius: 12px;
  font-weight: 700;
}
footer {
  text-align: center;
  padding: 1.5rem 1rem;
  border-top: 1px solid #e2e8f0;
}
.tg-links a {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 10px;
  text-decoration: none;
  margin: 4px;
  font-weight: 600;
  font-size: 0.95rem;
}
</style>
</head>
<body>

<header>
  <a href="fiz-masalalar.html" class="back-btn">← Orqaga</a>
  <h1>📘 INNOVA</h1>
  <a href="index.html" class="home-btn">🏠 Asosiy</a>
</header>

<div class="container" id="bookContainer"></div>

<!-- Yechim oynasi -->
<div class="modal-overlay" id="solModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-badge" id="m-title">1.1-masala</div>
    <div class="modal-sec">
      <div class="modal-sec-title">Masala sharti:</div>
      <div id="m-shart"></div>
    </div>
    <div class="modal-sec">
      <div class="modal-sec-title">Yechim va tahlil:</div>
      <div id="m-yechim"></div>
    </div>
    <div class="ans-box" id="m-javob"></div>
  </div>
</div>

<footer>
  <div class="tg-links">
    <a href="https://t.me" target="_blank">@Phismath21</a>
    <a href="https://t.me" target="_blank">@Abdullayev2104</a>
  </div>
</footer>

<script>
const container = document.getElementById('bookContainer');

INNOVA_DATA.boblar.forEach((bob, bIdx) => {
  const h2 = document.createElement('div');
  h2.className = 'bob-title';
  h2.innerText = bob.bobNomi;
  container.appendChild(h2);

  bob.bolimlar.forEach((bolim, sIdx) => {
    const item = document.createElement('div');
    item.className = 'acc-item';

    const btn = document.createElement('button');
    btn.className = 'acc-header';
    btn.innerHTML = `<span>${bolim.nomi}</span><span>▼</span>`;

    const body = document.createElement('div');
    body.className = 'acc-body';
    if (bIdx === 0 && sIdx === 0) body.classList.add('open');

    const grid = document.createElement('div');
    grid.className = 'num-grid';

    bolim.masalalar.forEach(m => {
      const mBtn = document.createElement('button');
      mBtn.className = 'num-btn';
      mBtn.innerText = m.raqam;
      mBtn.onclick = () => openModal(bolim.nomi, m);
      grid.appendChild(mBtn);
    });

    btn.onclick = () => {
      const isOpen = body.classList.contains('open');
      document.querySelectorAll('.acc-body').forEach(el => el.classList.remove('open'));
      if (!isOpen) body.classList.add('open');
    };

    body.appendChild(grid);
    item.appendChild(btn);
    item.appendChild(body);
    container.appendChild(item);
  });
});

function openModal(bolimNomi, m) {
  document.getElementById('m-title').innerText = `${bolimNomi} • ${m.raqam}-masala`;
  document.getElementById('m-shart').innerHTML = m.shart;
  document.getElementById('m-yechim').innerHTML = m.yechim;
  document.getElementById('m-javob').innerText = "Javob: " + m.javob;
  document.getElementById('solModal').classList.add('show');
}

function closeModal() {
  document.getElementById('solModal').classList.remove('show');
}

document.getElementById('solModal').addEventListener('click', (e) => {
  if (e.target.id === 'solModal') closeModal();
});
</script>

</body>
</html>
