<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKUB va EKUK kalkulyatori</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.box {
  margin: 2rem auto;
  width: 94%;
  max-width: 440px;
  background: #ffffff;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(79, 70, 229, 0.08);
  border: 1px solid #e2e8f0;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 10px;
  color: #334155;
}
.inputs {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
input {
  width: 100%;
  padding: 12px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  font-size: 16px;
  background: #f8fafc;
  text-align: center;
}
.btn {
  width: 100%;
  padding: 14px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 18px;
  background: #eef2ff;
  padding: 14px;
  border-radius: 12px;
  color: #1e293b;
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.7;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <a href="index.html" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#4f46e5; text-decoration:none; background:#eef2ff; padding:6px 12px; border-radius:8px; font-size:14px; font-weight:600;">🏠 Asosiy</a>

  <h3>EKUB va EKUK</h3>
</header>

<div class="box">
  <label>Natural sonlarni kiriting (3-son ixtiyoriy):</label>
  <div class="inputs">
    <input type="number" id="s1" placeholder="1-son" min="1" step="1">
    <input type="number" id="s2" placeholder="2-son" min="1" step="1">
    <input type="number" id="s3" placeholder="3-son" min="1" step="1">
  </div>
  <button class="btn" onclick="hisobEkubEkuk()">Hisoblash</button>
  <div class="natija" id="res-ekub"></div>
</div>

<script>
function ekub2(a, b) {
  while (b !== 0) {
    let t = b;
    b = a % b;
    a = t;
  }
  return a;
}

function ekuk2(a, b) {
  return (a * b) / ekub2(a, b);
}

function hisobEkubEkuk() {
  const a = parseInt(document.getElementById('s1').value);
  const b = parseInt(document.getElementById('s2').value);
  const cVal = document.getElementById('s3').value;
  const c = cVal !== '' ? parseInt(cVal) : null;

  const res = document.getElementById('res-ekub');
  res.style.display = 'block';

  if (isNaN(a) || isNaN(b) || a < 1 || b < 1 || (c !== null && (isNaN(c) || c < 1))) {
    res.innerText = "Iltimos, musbat butun (natural) sonlarni kiriting!";
    return;
  }

  let g = ekub2(a, b);
  let l = ekuk2(a, b);
  let royxat = `${a}, ${b}`;

  if (c !== null) {
    g = ekub2(g, c);
    l = ekuk2(l, c);
    royxat += `, ${c}`;
  }

  res.innerHTML = `EKUB(${royxat}) = ${g}<br>EKUK(${royxat}) = ${l}`;
}
</script>

</body>
</html>
