<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvadrat va chiziqli tenglamalar</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.container {
  margin: 1.5rem auto;
  width: 92%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.box {
  background: #ffffff;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 10px 25px rgba(79, 70, 229, 0.07);
  border: 1px solid #e2e8f0;
}
h4 {
  color: #312e81;
  margin-bottom: 12px;
  font-size: 1.15rem;
}
.formula-hint {
  background: #f8fafc;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 600;
  color: #4f46e5;
  margin-bottom: 14px;
  text-align: center;
  border: 1px solid #e2e8f0;
}
.inputs {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
input {
  width: 100%;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  background: #f8fafc;
  text-align: center;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 14px;
  background: #eef2ff;
  padding: 12px;
  border-radius: 12px;
  color: #1e293b;
  font-weight: 600;
  line-height: 1.5;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <h3>Tenglamalar kalkulyatori</h3>
</header>

<div class="container">

  <!-- 1. Kvadrat tenglama -->
  <div class="box">
    <h4>1. Kvadrat tenglama</h4>
    <div class="formula-hint">ax² + bx + c = 0</div>
    <div class="inputs">
      <input type="number" id="ka" placeholder="a =" step="any">
      <input type="number" id="kb" placeholder="b =" step="any">
      <input type="number" id="kc" placeholder="c =" step="any">
    </div>
    <button class="btn" onclick="yechKvadrat()">Yechish</button>
    <div class="natija" id="res-kv"></div>
  </div>

  <!-- 2. Chiziqli tenglama -->
  <div class="box">
    <h4>2. Chiziqli tenglama</h4>
    <div class="formula-hint">kx + b = 0</div>
    <div class="inputs">
      <input type="number" id="ck" placeholder="k =" step="any">
      <input type="number" id="cb" placeholder="b =" step="any">
    </div>
    <button class="btn" onclick="yechChiziqli()">Yechish</button>
    <div class="natija" id="res-ch"></div>
  </div>

</div>

<script>
function yechKvadrat() {
  const a = parseFloat(document.getElementById('ka').value);
  const b = parseFloat(document.getElementById('kb').value);
  const c = parseFloat(document.getElementById('kc').value);
  const res = document.getElementById('res-kv');
  res.style.display = 'block';

  if (isNaN(a) || isNaN(b) || isNaN(c)) {
    res.innerText = "Iltimos, barcha koeffitsiyentlarni kiriting!";
    return;
  }
  if (a === 0) {
    res.innerText = "a = 0 bo'lsa, bu chiziqli tenglama bo'ladi!";
    return;
  }

  const d = b * b - 4 * a * c;
  if (d > 0) {
    const x1 = (-b + Math.sqrt(d)) / (2 * a);
    const x2 = (-b - Math.sqrt(d)) / (2 * a);
    res.innerHTML = `Diskriminant: D = ${parseFloat(d.toFixed(6))}<br>x₁ = ${parseFloat(x1.toFixed(6))}<br>x₂ = ${parseFloat(x2.toFixed(6))}`;
  } else if (d === 0) {
    const x = -b / (2 * a);
    res.innerHTML = `Diskriminant: D = 0<br>Yagona ildiz: x = ${parseFloat(x.toFixed(6))}`;
  } else {
    const real = parseFloat((-b / (2 * a)).toFixed(4));
    const imag = parseFloat((Math.sqrt(-d) / (2 * a)).toFixed(4));
    res.innerHTML = `Diskriminant: D = ${parseFloat(d.toFixed(6))} (< 0)<br>Haqiqiy ildizlari yo'q.<br>Kompleks ildizlar: ${real} ± ${imag}i`;
  }
}

function yechChiziqli() {
  const k = parseFloat(document.getElementById('ck').value);
  const b = parseFloat(document.getElementById('cb').value);
  const res = document.getElementById('res-ch');
  res.style.display = 'block';

  if (isNaN(k) || isNaN(b)) {
    res.innerText = "Iltimos, k va b qiymatlarini kiriting!";
    return;
  }
  if (k === 0) {
    res.innerText = b === 0 ? "Cheksiz ko'p yechimga ega (0 = 0)" : "Yechimi yo'q!";
    return;
  }
  const x = -b / k;
  res.innerText = `Yechim: x = ${parseFloat(x.toFixed(6))}`;
}
</script>

</body>
</html>
