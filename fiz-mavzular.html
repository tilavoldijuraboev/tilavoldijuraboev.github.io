<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizika — Mavzular</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<script src="fiz-mavzular-data.js?v=2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
body { background-color: var(--bg, #f1f5f9); color: var(--text, #1e293b); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
header { background: var(--surface, #ffffff); padding: 1.3rem 1rem; text-align: center; border-bottom: 3px solid var(--accent, #4f46e5); position: relative; display: flex; align-items: center; justify-content: center; }
header h1 { font-size: 1.55rem; font-weight: 700; color: var(--text, #312e81); }
.nav-btn { position: absolute; top: 50%; transform: translateY(-50%); padding: 7px 14px; border-radius: 10px; text-decoration: none; background: var(--accent-soft, #eef2ff); color: var(--accent, #4f46e5); font-size: 0.9rem; font-weight: 600; border: none; cursor: pointer; }
.back-btn { left: 15px; }
.home-btn { right: 15px; }
.container { max-width: 680px; width: 100%; margin: 1.5rem auto; padding: 0 1rem; flex: 1; }
.bob-card { background: var(--surface, #ffffff); border: 1px solid var(--border, #e2e8f0); border-radius: 16px; padding: 1.15rem 1.3rem; margin-bottom: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 14px; }
.bob-icon { font-size: 1.6rem; background: var(--accent-soft, #eef2ff); width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bob-info h3 { font-size: 1.15rem; margin-bottom: 4px; }
.bob-info p { font-size: 0.85rem; opacity: 0.75; line-height: 1.35; }
.mavzu-item { background: var(--surface, #ffffff); border: 1px solid var(--border, #e2e8f0); border-radius: 14px; padding: 1rem 1.2rem; margin-bottom: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 1.05rem; }
.mavzu-badge { background: var(--accent-soft, #eef2ff); color: var(--accent, #4f46e5); padding: 4px 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 700; }
.lesson-box { background: var(--surface, #ffffff); border: 1px solid var(--border, #e2e8f0); border-radius: 16px; padding: 1.3rem; }
.lesson-title { font-size: 1.25rem; color: var(--accent, #4f46e5); margin-bottom: 1rem; border-bottom: 1px solid var(--border, #e2e8f0); padding-bottom: 0.7rem; }
.formula-card { background: var(--accent-soft, #eef2ff); border-left: 4px solid var(--accent, #4f46e5); padding: 0.8rem 1rem; border-radius: 10px; margin-bottom: 0.6rem; }
.formula-math { font-size: 1.1rem; font-weight: 700; color: var(--accent, #4f46e5); }
.formula-desc { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
.related-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border, #e2e8f0); }
.rel-btn { text-decoration: none; background: var(--accent, #4f46e5); color: #ffffff; padding: 8px 14px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; }
.empty-msg { text-align: center; padding: 2rem 1rem; opacity: 0.7; }
footer { text-align: center; padding: 1.2rem 1rem; background: var(--surface, #ffffff); border-top: 1px solid var(--border, #e2e8f0); margin-top: 2rem; }
.tg-links a { display: inline-block; padding: 6px 14px; border-radius: 10px; text-decoration: none; margin: 3px; font-weight: 600; font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <button class="nav-btn back-btn" onclick="goBack()">← Orqaga</button>
  <h1 id="page-title">📚 Mavzular</h1>
  <a href="index.html" class="nav-btn home-btn">🏠 Asosiy</a>
</header>
<div class="container" id="app"></div>
<footer>
  <div class="tg-links">
    <a href="https://t.me" target="_blank">@Phismath21</a>
    <a href="https://t.me" target="_blank">@Abdullayev2104</a>
  </div>
</footer>
<script>
let currentView = 'boblar', selectedBob = null;
function renderBoblar() {
  currentView = 'boblar'; selectedBob = null;
  document.getElementById('page-title').textContent = '📚 Mavzular';
  document.getElementById('app').innerHTML = FIZIKA_MAVZULAR.map((bob, idx) => `
    <div class="bob-card" onclick="openBob(${idx})">
      <div class="bob-icon">${bob.ikonka}</div>
      <div class="bob-info"><h3>${bob.bobNomi}</h3><p>${bob.tavsif}</p></div>
    </div>`).join('');
}
function openBob(idx) {
  currentView = 'mavzular'; selectedBob = idx;
  const bob = FIZIKA_MAVZULAR[idx];
  document.getElementById('page-title').textContent = bob.bobNomi;
  const app = document.getElementById('app');
  if (!bob.mavzular || bob.mavzular.length === 0) {
    app.innerHTML = `<div class="lesson-box empty-msg">Ushbu bob uchun mavzular tez orada qo'shiladi...</div>`;
    return;
  }
  app.innerHTML = bob.mavzular.map((m, mIdx) => `
    <div class="mavzu-item" onclick="openMavzu(${idx}, ${mIdx})">
      <span class="mavzu-badge">${m.raqam}</span><span>${m.nomi}</span>
    </div>`).join('');
}
function openMavzu(bobIdx, mIdx) {
  currentView = 'dars';
  const m = FIZIKA_MAVZULAR[bobIdx].mavzular[mIdx];
  document.getElementById('page-title').textContent = m.raqam + '-mavzu';
  let fHTML = m.formulalar?.length ? `<h4 style="margin:1rem 0 0.6rem;">📌 Asosiy formulalar:</h4>` + m.formulalar.map(f => `<div class="formula-card"><div class="formula-math">${f.formula}</div><div class="formula-desc">${f.izoh}</div></div>`).join('') : '';
  let lHTML = m.havolalar?.length ? `<div class="related-links">` + m.havolalar.map(h => `<a href="${h.url}" class="rel-btn">${h.nomi}</a>`).join('') + `</div>` : '';
  document.getElementById('app').innerHTML = `<div class="lesson-box"><h2 class="lesson-title">${m.raqam}. ${m.nomi}</h2><div>${m.nazariya}</div>${fHTML}${lHTML}</div>`;
  if (typeof initSimulations === 'function') initSimulations();
}
function goBack() {
  if (currentView === 'dars') openBob(selectedBob);
  else if (currentView === 'mavzular') renderBoblar();
  else window.location.href = 'fizika.html';
}
let refFrame = 'ground', animId = null, busX = 20, boyRelX = 15, boyDir = 1;
function setRefFrame(frame) {
  refFrame = frame;
  document.getElementById('btnGround')?.classList.toggle('active', frame === 'ground');
  document.getElementById('btnBus')?.classList.toggle('active', frame === 'bus');
  const desc = document.getElementById('relDesc');
  if (desc) desc.textContent = frame === 'ground' ? "Yerga nisbatan: Avtobus ham, bola ham tez harakatlanmoqda." : "Avtobusga nisbatan: Avtobus tinch (daraxt orqaga ketmoqda), bola sekin yurmoqda.";
}
function initSimulations() {
  const relCanvas = document.getElementById('relCanvas');
  if (relCanvas) {
    const ctx = relCanvas.getContext('2d');
    if (animId) cancelAnimationFrame(animId);
    let treeX = 260;
    (function loop() {
      ctx.clearRect(0, 0, 320, 140);
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 115, 320, 25);
      if (refFrame === 'ground') { busX += 1.2; if (busX > 330) busX = -130; treeX = 260; }
      else { busX = 95; treeX -= 1.2; if (treeX < -30) treeX = 340; }
      boyRelX += 0.4 * boyDir;
      if (boyRelX > 85) boyDir = -1; if (boyRelX < 15) boyDir = 1;
      ctx.fillStyle = '#92400e'; ctx.fillRect(treeX - 4, 80, 8, 35);
      ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(treeX, 70, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3b82f6'; ctx.fillRect(busX, 55, 120, 48);
      ctx.fillStyle = '#dbeafe'; ctx.fillRect(busX + 8, 63, 104, 24);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.arc(busX + 25, 106, 9, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(busX + 95, 106, 9, 0, Math.PI * 2); ctx.fill();
      const bx = busX + boyRelX;
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(bx, 72, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(bx - 3, 77, 6, 10);
      animId = requestAnimationFrame(loop);
    })();
  }
  const dCanvas = document.getElementById('drawCanvas');
  if (dCanvas) setupDrawCanvas(dCanvas);
}
let drawPoints = [], isDrawing = false;
function setupDrawCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  drawGrid(ctx, canvas);
  const getPos = e => {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * (canvas.width / r.width), y: (cy - r.top) * (canvas.height / r.height) };
  };
  const start = e => { e.preventDefault(); isDrawing = true; drawPoints = [getPos(e)]; redraw(); };
  const move = e => { if (!isDrawing) return; e.preventDefault(); drawPoints.push(getPos(e)); redraw(); };
  const end = () => { isDrawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; window.onmouseup = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function drawGrid(ctx, canvas) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  for (let x = 0; x <= canvas.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(20, canvas.height); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 200); ctx.lineTo(canvas.width, 200); ctx.stroke();
  ctx.fillStyle = '#475569'; ctx.font = 'bold 11px sans-serif';
  ctx.fillText('Y', 8, 14); ctx.fillText('X', 306, 214); ctx.fillText('0', 10, 213);
}
function redraw() {
  const canvas = document.getElementById('drawCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  drawGrid(ctx, canvas);
  if (!drawPoints.length) return;
  ctx.strokeStyle = '#4f46e5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(drawPoints[0].x, drawPoints[0].y);
  let totalPx = 0;
  for (let i = 1; i < drawPoints.length; i++) {
    ctx.lineTo(drawPoints[i].x, drawPoints[i].y);
    totalPx += Math.hypot(drawPoints[i].x - drawPoints[i-1].x, drawPoints[i].y - drawPoints[i-1].y);
  }
  ctx.stroke();
  const p0 = drawPoints[0], p1 = drawPoints[drawPoints.length - 1];
  ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(p0.x, p0.y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.arc(p1.x, p1.y, 5, 0, Math.PI * 2); ctx.fill();
  document.getElementById('valPath').textContent = (totalPx / 20).toFixed(1);
  document.getElementById('valDisp').textContent = (Math.hypot(p1.x - p0.x, p1.y - p0.y) / 20).toFixed(1);
  document.getElementById('valCoords').textContent = `A(${((p0.x-20)/20).toFixed(1)};${((200-p0.y)/20).toFixed(1)}) → B(${((p1.x-20)/20).toFixed(1)};${((200-p1.y)/20).toFixed(1)})`;
}
function clearDrawCanvas() {
  drawPoints = [];
  const canvas = document.getElementById('drawCanvas');
  if (canvas) drawGrid(canvas.getContext('2d'), canvas);
  document.getElementById('valPath').textContent = '0.0';
  document.getElementById('valDisp').textContent = '0.0';
  document.getElementById('valCoords').textContent = 'A(0;0) → B(0;0)';
}
renderBoblar();
</script>
</body>
</html>
