<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizika — Mavzular</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<script src="fiz-mavzular-data.js?v=1"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
body {
  background-color: var(--bg, #f1f5f9);
  color: var(--text, #1e293b);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
header {
  background: var(--surface, #ffffff);
  padding: 1.3rem 1rem;
  text-align: center;
  border-bottom: 3px solid var(--accent, #4f46e5);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
header h1 { font-size: 1.55rem; font-weight: 700; color: var(--text, #312e81); }
.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  padding: 7px 14px;
  border-radius: 10px;
  text-decoration: none;
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  font-size: 0.9rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.back-btn { left: 15px; }
.home-btn { right: 15px; }

.container {
  max-width: 680px;
  width: 100%;
  margin: 1.5rem auto;
  padding: 0 1rem;
  flex: 1;
}
.bob-card {
  background: var(--surface, #ffffff);
  border: 1px solid var(--border, #e2e8f0);
  border-radius: 16px;
  padding: 1.15rem 1.3rem;
  margin-bottom: 0.9rem;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bob-card:hover { transform: translateY(-2px); border-color: var(--accent, #4f46e5); }
.bob-icon {
  font-size: 1.6rem;
  background: var(--accent-soft, #eef2ff);
  width: 48px;
  height: 48px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.bob-info h3 { font-size: 1.15rem; margin-bottom: 4px; color: var(--text, #1e293b); }
.bob-info p { font-size: 0.85rem; opacity: 0.75; line-height: 1.35; }

.mavzu-item {
  background: var(--surface, #ffffff);
  border: 1px solid var(--border, #e2e8f0);
  border-radius: 14px;
  padding: 1rem 1.2rem;
  margin-bottom: 0.75rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 600;
  font-size: 1.05rem;
}
.mavzu-item:hover { border-color: var(--accent, #4f46e5); }
.mavzu-badge {
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
}

.lesson-box {
  background: var(--surface, #ffffff);
  border: 1px solid var(--border, #e2e8f0);
  border-radius: 16px;
  padding: 1.4rem;
}
.lesson-title { font-size: 1.3rem; color: var(--accent, #4f46e5); margin-bottom: 1rem; border-bottom: 1px solid var(--border, #e2e8f0); padding-bottom: 0.7rem; }
.lesson-text p { margin-bottom: 0.9rem; line-height: 1.6; font-size: 1rem; }
.formula-card {
  background: var(--accent-soft, #eef2ff);
  border-left: 4px solid var(--accent, #4f46e5);
  padding: 0.8rem 1rem;
  border-radius: 10px;
  margin-bottom: 0.6rem;
}
.formula-math { font-size: 1.15rem; font-weight: 700; color: var(--accent, #4f46e5); }
.formula-desc { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }

.related-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid var(--border, #e2e8f0); }
.rel-btn {
  text-decoration: none;
  background: var(--accent, #4f46e5);
  color: #ffffff;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 0.9rem;
  font-weight: 600;
}
.empty-msg { text-align: center; padding: 2rem 1rem; opacity: 0.7; font-size: 0.95rem; }

footer {
  text-align: center;
  padding: 1.2rem 1rem;
  background: var(--surface, #ffffff);
  border-top: 1px solid var(--border, #e2e8f0);
  margin-top: 2rem;
}
.tg-links a { display: inline-block; padding: 6px 14px; border-radius: 10px; text-decoration: none; margin: 3px; font-weight: 600; font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <button id="back-action" class="nav-btn back-btn" onclick="goBack()">← Orqaga</button>
  <h1 id="page-title">📚 Mavzular</h1>
  <a href="index.html" class="nav-btn home-btn">🏠 Asosiy</a>
</header>

<div class="container" id="app"></div>

<footer>
  <div class="tg-links">
    <a href="https://t.me" target="_blank">@Phismath21</a>
    <a href="https://t.me" target="_blank">@Abdullayev2104</a>
  </div>
</footer>

<script>
let currentView = 'boblar';
let selectedBob = null;

function renderBoblar() {
  currentView = 'boblar';
  selectedBob = null;
  document.getElementById('page-title').textContent = '📚 Mavzular';
  const app = document.getElementById('app');
  app.innerHTML = FIZIKA_MAVZULAR.map((bob, idx) => `
    <div class="bob-card" onclick="openBob(${idx})">
      <div class="bob-icon">${bob.ikonka}</div>
      <div class="bob-info">
        <h3>${bob.bobNomi}</h3>
        <p>${bob.tavsif}</p>
      </div>
    </div>
  `).join('');
}

function openBob(idx) {
  currentView = 'mavzular';
  selectedBob = idx;
  const bob = FIZIKA_MAVZULAR[idx];
  document.getElementById('page-title').textContent = bob.bobNomi;
  const app = document.getElementById('app');

  if (!bob.mavzular || bob.mavzular.length === 0) {
    app.innerHTML = `<div class="lesson-box empty-msg">Ushbu bob uchun mavzular tez orada qo'shiladi...</div>`;
    return;
  }

  app.innerHTML = bob.mavzular.map((m, mIdx) => `
    <div class="mavzu-item" onclick="openMavzu(${idx}, ${mIdx})">
      <span class="mavzu-badge">${m.raqam}</span>
      <span>${m.nomi}</span>
    </div>
  `).join('');
}

function openMavzu(bobIdx, mIdx) {
  currentView = 'dars';
  const m = FIZIKA_MAVZULAR[bobIdx].mavzular[mIdx];
  document.getElementById('page-title').textContent = m.raqam + '-mavzu';
  const app = document.getElementById('app');

  let formulalarHTML = '';
  if (m.formulalar && m.formulalar.length > 0) {
    formulalarHTML = `<h4 style="margin: 1rem 0 0.6rem;">📌 Asosiy formulalar:</h4>` +
      m.formulalar.map(f => `
        <div class="formula-card">
          <div class="formula-math">${f.formula}</div>
          <div class="formula-desc">${f.izoh}</div>
        </div>
      `).join('');
  }

  let linksHTML = '';
  if (m.havolalar && m.havolalar.length > 0) {
    linksHTML = `<div class="related-links">` +
      m.havolalar.map(h => `<a href="${h.url}" class="rel-btn">${h.nomi}</a>`).join('') +
      `</div>`;
  }

  app.innerHTML = `
    <div class="lesson-box">
      <h2 class="lesson-title">${m.raqam}. ${m.nomi}</h2>
      <div class="lesson-text">${m.nazariya}</div>
      ${formulalarHTML}
      ${linksHTML}
    </div>
  `;
}

function goBack() {
  if (currentView === 'dars') {
    openBob(selectedBob);
  } else if (currentView === 'mavzular') {
    renderBoblar();
  } else {
    window.location.href = 'fizika.html';
  }
}

renderBoblar();
</script>
</body>
</html>
