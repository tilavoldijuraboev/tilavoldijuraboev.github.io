<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenglamalar sistemasi</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.box {
  margin: 2rem auto;
  width: 94%;
  max-width: 480px;
  background: #ffffff;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(79, 70, 229, 0.08);
  border: 1px solid #e2e8f0;
}
.formula-hint {
  background: #f8fafc;
  padding: 10px;
  border-radius: 12px;
  font-weight: 600;
  color: #4f46e5;
  margin-bottom: 18px;
  text-align: center;
  border: 1px solid #e2e8f0;
  line-height: 1.6;
}
.eq-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
}
.eq-row span {
  font-weight: 700;
  color: #334155;
  font-size: 16px;
}
input {
  width: 100%;
  padding: 10px 6px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 16px;
  background: #f8fafc;
  text-align: center;
}
.btn {
  width: 100%;
  padding: 14px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 6px;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 18px;
  background: #eef2ff;
  padding: 14px;
  border-radius: 12px;
  color: #1e293b;
  font-weight: 600;
  line-height: 1.6;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <h3>Tenglamalar sistemasi</h3>
</header>

<div class="box">
  <div class="formula-hint">
    a₁x + b₁y = c₁<br>
    a₂x + b₂y = c₂
  </div>

  <div class="eq-row">
    <input type="number" id="a1" placeholder="a₁" step="any">
    <span>x +</span>
    <input type="number" id="b1" placeholder="b₁" step="any">
    <span>y =</span>
    <input type="number" id="c1" placeholder="c₁" step="any">
  </div>

  <div class="eq-row">
    <input type="number" id="a2" placeholder="a₂" step="any">
    <span>x +</span>
    <input type="number" id="b2" placeholder="b₂" step="any">
    <span>y =</span>
    <input type="number" id="c2" placeholder="c₂" step="any">
  </div>

  <button class="btn" onclick="yechSistema()">Sistemani yechish</button>
  <div class="natija" id="res-sis"></div>
</div>

<script>
function yechSistema() {
  const a1 = parseFloat(document.getElementById('a1').value);
  const b1 = parseFloat(document.getElementById('b1').value);
  const c1 = parseFloat(document.getElementById('c1').value);
  const a2 = parseFloat(document.getElementById('a2').value);
  const b2 = parseFloat(document.getElementById('b2').value);
  const c2 = parseFloat(document.getElementById('c2').value);

  const res = document.getElementById('res-sis');
  res.style.display = 'block';

  if ([a1, b1, c1, a2, b2, c2].some(isNaN)) {
    res.innerText = "Iltimos, barcha 6 ta koeffitsiyentni kiriting!";
    return;
  }

  const delta = a1 * b2 - a2 * b1;
  const deltaX = c1 * b2 - c2 * b1;
  const deltaY = a1 * c2 - a2 * c1;

  if (delta !== 0) {
    const x = deltaX / delta;
    const y = deltaY / delta;
    res.innerHTML = `Yagona yechim:<br>x = ${parseFloat(x.toFixed(6))}<br>y = ${parseFloat(y.toFixed(6))}`;
  } else {
    if (deltaX === 0 && deltaY === 0) {
      res.innerText = "Sistema cheksiz ko'p yechimga ega.";
    } else {
      res.innerText = "Sistemaning yechimi yo'q (chiziqlar parallel).";
    }
  }
}
</script>

</body>
</html>
