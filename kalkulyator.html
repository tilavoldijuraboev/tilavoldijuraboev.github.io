<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator — Fizika va Matematika</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background-color: #eef5f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%);
            color: white;
            padding: 1.2rem 1rem;
            text-align: center;
            border-bottom: 4px solid #e11d48;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .back-btn:hover {
            background: #e11d48;
        }
        .calc-wrapper {
            margin: auto;
            padding: 1.5rem 1rem;
            width: 100%;
            max-width: 380px;
        }
        .calculator {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(6, 78, 59, 0.15);
            border: 1px solid #d1fae5;
        }
        .display {
            background: #064e3b;
            color: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            word-wrap: break-word;
            word-break: break-all;
        }
        .prev-operand {
            color: #a7f3d0;
            font-size: 1rem;
            min-height: 22px;
        }
        .curr-operand {
            font-size: 2.2rem;
            font-weight: bold;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 18px 0;
            cursor: pointer;
            background: #f3f7f5;
            color: #064e3b;
        }
        button:hover {
            background: #d1fae5;
        }
        .btn-op {
            background: #ecfdf5;
            color: #059669;
            font-size: 1.4rem;
        }
        .btn-clear {
            background: #ffe4e6;
            color: #e11d48;
        }
        .btn-equal {
            background: #e11d48;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← Orqaga</a>
        <h2>Oddiy Kalkulyator</h2>
    </header>

    <div class="calc-wrapper">
        <div class="calculator">
            <div class="display">
                <div class="prev-operand" id="prev"></div>
                <div class="curr-operand" id="curr">0</div>
            </div>
            <div class="buttons">
                <button class="btn-clear" onclick="clearAll()">C</button>
                <button class="btn-clear" onclick="deleteLast()">⌫</button>
                <button onclick="appendNum('7')">7</button>
                <button onclick="appendNum('8')">8</button>
                <button onclick="appendNum('9')">9</button>
                <button class="btn-op" onclick="appendOp('×')">×</button>

                <button onclick="appendNum('4')">4</button>
                <button onclick="appendNum('5')">5</button>
                <button onclick="appendNum('6')">6</button>
                <button class="btn-op" onclick="appendOp('-')">−</button>

                <button onclick="appendNum('1')">1</button>
                <button onclick="appendNum('2')">2</button>
                <button onclick="appendNum('3')">3</button>
                <button class="btn-op" onclick="appendOp('+')">+</button>

                <button onclick="appendNum('0')">0</button>
                <button onclick="appendNum('.')">.</button>
                <button class="btn-equal" onclick="calculate()">=</button>
            </div>
        </div>
    </div>

    <script>
        let current = '0';
        let previous = '';
        let operation = null;

        const currEl = document.getElementById('curr');
        const prevEl = document.getElementById('prev');

        function updateDisplay() {
            currEl.innerText = current;
            prevEl.innerText = operation ? ${previous} ${operation} : '';
        }

        function appendNum(num) {
            if (num === '.' && current.includes('.')) return;
            if (current === '0' && num !== '.') {
                current = num;
            } else {
                current += num;
            }
            updateDisplay();
        }

        function appendOp(op) {
            if (current === '') return;
            if (previous !== '') {
                calculate();
            }
            operation = op;
            previous = current;
            current = '';
            updateDisplay();
        }

        function clearAll() {
            current = '0';
            previous = '';
            operation = null;
            updateDisplay();
        }

        function deleteLast() {
            if (current.length <= 1) {
                current = '0';
            } else {
                current = current.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            let result;
            const prev = parseFloat(previous);
            const curr = parseFloat(current);
            if (isNaN(prev) || isNaN(curr)) return;

            switch (operation) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '×': result = prev * curr; break;
                case '÷':
                    if (curr === 0) {
                        alert("Nolga bo'lish mumkin emas!");
                        clearAll();
                        return;
                    }
                    result = prev / curr;
                    break;
                case '%': result = (prev * curr) / 100; break;
                default: return;
            }
            current = Math.round(result * 100000000) / 100000000 + '';
            operation = null;
            previous = '';
            updateDisplay();
        }
    </script>

</body>
</html>
                <button class="btn-op" onclick="appendOp('%')">%</button>
                <button class="btn-op" onclick="appendOp('÷')">÷</button>
