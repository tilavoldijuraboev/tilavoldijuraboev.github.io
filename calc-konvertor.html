<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'lchov birliklari konvertori</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: #ffffff;
  color: #312e81;
  padding: 15px;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
}
.back {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4f46e5;
  text-decoration: none;
  background: #eef2ff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
}
.box {
  margin: 2rem auto;
  width: 94%;
  max-width: 460px;
  background: #ffffff;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 12px 30px rgba(79, 70, 229, 0.08);
  border: 1px solid #e2e8f0;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: #334155;
}
select, input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #cbd5e1;
  border-radius: 12px;
  font-size: 16px;
  background: #f8fafc;
  color: #1e293b;
  margin-bottom: 14px;
}
select {
  font-weight: 600;
  color: #4f46e5;
}
.row {
  display: flex;
  gap: 10px;
}
.btn {
  width: 100%;
  padding: 14px;
  background: #4f46e5;
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}
.btn:hover {
  background: #4338ca;
}
.natija {
  margin-top: 18px;
  background: #eef2ff;
  padding: 14px;
  border-radius: 12px;
  color: #1e293b;
  font-weight: 600;
  line-height: 1.7;
  display: none;
}
</style>
</head>
<body>

<header>
  <a href="kalkulyator.html" class="back">← Orqaga</a>
  <a href="index.html" style="position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#4f46e5; text-decoration:none; background:#eef2ff; padding:6px 12px; border-radius:8px; font-size:14px; font-weight:600;">🏠 Asosiy</a>

  <h3>Birliklar konvertori</h3>
</header>

<div class="box">
  <label for="tur">Fizik kattalikni tanlang:</label>
  <select id="tur" onchange="birlikYangila()">
    <option value="tezlik">Tezlik (km/soat ↔ m/s)</option>
    <option value="harorat">Harorat (°C ↔ K ↔ °F)</option>
    <option value="bosim">Bosim (Pa ↔ atm ↔ mm.sim.ust)</option>
    <option value="energiya">Energiya (J ↔ kJ ↔ kal ↔ kkal)</option>
  </select>

  <div class="row">
    <input type="number" id="qiymat" placeholder="Qiymatni kiriting" step="any">
    <select id="birlik" style="width: 150px;"></select>
  </div>

  <button class="btn" onclick="aylantir()">Aylantirish</button>
  <div class="natija" id="res-konv"></div>
</div>

<script>
const birliklar = {
  tezlik: [
    { val: 'kmh', text: 'km/soat' },
    { val: 'ms', text: 'm/s' }
  ],
  harorat: [
    { val: 'c', text: 'Selsiy (°C)' },
    { val: 'k', text: 'Kelvin (K)' },
    { val: 'f', text: 'Farengeyt (°F)' }
  ],
  bosim: [
    { val: 'pa', text: 'Paskal (Pa)' },
    { val: 'kpa', text: 'Kilopaskal (kPa)' },
    { val: 'atm', text: 'Atmosfera (atm)' },
    { val: 'mmhg', text: 'mm.sim.ust' }
  ],
  energiya: [
    { val: 'j', text: 'Joul (J)' },
    { val: 'kj', text: 'Kilojoul (kJ)' },
    { val: 'cal', text: 'Kaloriya (kal)' },
    { val: 'kcal', text: 'Kilokaloriya (kkal)' }
  ]
};

function birlikYangila() {
  const tur = document.getElementById('tur').value;
  const sel = document.getElementById('birlik');
  document.getElementById('res-konv').style.display = 'none';
  sel.innerHTML = '';
  birliklar[tur].forEach(b => {
    const opt = document.createElement('option');
    opt.value = b.val;
    opt.innerText = b.text;
    sel.appendChild(opt);
  });
}

function aylantir() {
  const tur = document.getElementById('tur').value;
  const v = parseFloat(document.getElementById('qiymat').value);
  const b = document.getElementById('birlik').value;
  const res = document.getElementById('res-konv');
  res.style.display = 'block';

  if (isNaN(v)) {
    res.innerText = "Iltimos, qiymat kiriting!";
    return;
  }

  if (tur === 'tezlik') {
    if (b === 'kmh') {
      res.innerHTML = `${v} km/soat = <strong>${parseFloat((v / 3.6).toFixed(6))} m/s</strong>`;
    } else {
      res.innerHTML = `${v} m/s = <strong>${parseFloat((v * 3.6).toFixed(6))} km/soat</strong>`;
    }
  } else if (tur === 'harorat') {
    let c, k, f;
    if (b === 'c') { c = v; k = v + 273.15; f = (v * 9 / 5) + 32; }
    if (b === 'k') { k = v; c = v - 273.15; f = (c * 9 / 5) + 32; }
    if (b === 'f') { f = v; c = (v - 32) * 5 / 9; k = c + 273.15; }
    res.innerHTML = `Selsiy: <strong>${parseFloat(c.toFixed(4))} °C</strong><br>Kelvin: <strong>${parseFloat(k.toFixed(4))} K</strong><br>Farengeyt: <strong>${parseFloat(f.toFixed(4))} °F</strong>`;
  } else if (tur === 'bosim') {
    let pa;
    if (b === 'pa') pa = v;
    if (b === 'kpa') pa = v * 1000;
    if (b === 'atm') pa = v * 101325;
    if (b === 'mmhg') pa = v * 133.322;
    res.innerHTML = `Paskal: <strong>${parseFloat(pa.toFixed(4))} Pa</strong><br>Kilopaskal: <strong>${parseFloat((pa / 1000).toFixed(6))} kPa</strong><br>Atmosfera: <strong>${parseFloat((pa / 101325).toFixed(6))} atm</strong><br>mm.sim.ust: <strong>${parseFloat((pa / 133.322).toFixed(4))} mm.sim.ust</strong>`;
  } else if (tur === 'energiya') {
    let j;
    if (b === 'j') j = v;
    if (b === 'kj') j = v * 1000;
    if (b === 'cal') j = v * 4.184;
    if (b === 'kcal') j = v * 4184;
    res.innerHTML = `Joul: <strong>${parseFloat(j.toFixed(4))} J</strong><br>Kilojoul: <strong>${parseFloat((j / 1000).toFixed(6))} kJ</strong><br>Kaloriya: <strong>${parseFloat((j / 4.184).toFixed(4))} kal</strong><br>Kilokaloriya: <strong>${parseFloat((j / 4184).toFixed(6))} kkal</strong>`;
  }
}

birlikYangila();
</script>

</body>
</html>
