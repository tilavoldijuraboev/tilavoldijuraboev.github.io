<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizika va Matematika</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background-color: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
header {
  background: #ffffff;
  color: #1e293b;
  padding: 1.5rem 1rem;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
header h1 {
  font-size: 1.85rem;
  font-weight: 700;
  color: #312e81;
}
.theme-select {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid var(--border, #e2e8f0);
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.dark-btn {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  padding: 7px 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.dark-btn:hover {
  background: var(--accent, #4f46e5);
  color: #ffffff;
}
@media (max-width: 540px) {
  header {
    flex-direction: column;
    gap: 12px;
    padding: 1.2rem 1rem;
  }
  .theme-select, .dark-btn {
    position: static;
    transform: none;
  }
  .header-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
}
.menu-column {
  max-width: 480px;
  width: 100%;
  margin: 2.5rem auto;
  padding: 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}
.menu-item {
  display: block;
  background: #ffffff;
  color: #1e293b;
  text-decoration: none;
  font-size: 1.35rem;
  font-weight: 600;
  padding: 1.3rem 2rem;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #e2e8f0;
  transition: all 0.25s ease;
}
.menu-item:hover {
  transform: translateY(-3px);
}
footer {
  text-align: center;
  padding: 1.5rem 1rem;
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
}
.tg-links a {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 10px;
  text-decoration: none;
  margin: 4px;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s;
}
</style>
</head>
<body>

<header>
  <h1>Fizika va Matematika</h1>
  <div class="header-controls">
    <select id="theme-select" class="theme-select" title="Mavzuni tanlash">
      <option value="standart">🎨 Standart</option>
      <option value="qogoz">📜 Qog'oz</option>
      <option value="doska">🟩 Doska</option>
      <option value="kok">📘 Ko'k</option>
      <option value="minimalist">⚪ Minimalist</option>

    </select>
    <button id="dark-toggle" class="dark-btn">🌙 Tun</button>
  </div>
</header>

<div class="menu-column">
  <a href="fizika.html" class="menu-item">⚛️ Fizika</a>
  <a href="matematika.html" class="menu-item">📐 Matematika</a>
  <a href="blog.html" class="menu-item">✍️ Blog</a>
  <a href="kalkulyator.html" class="menu-item">🧮 Kalkulyator</a>
</div>

<footer>
  <div class="tg-links">
    <a href="https://t.me" target="_blank">@Phismath21</a>
    <a href="https://t.me" target="_blank">@Abdullayev2104</a>
  </div>
</footer>

</body>
</html>
