<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizika va Matematika</title>
<link rel="stylesheet" href="theme.css?v=3">
<script src="theme.js?v=3"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
}
body {
  background-color: #f1f5f9;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
header {
  background: #ffffff;
  color: #1e293b;
  padding: 1.5rem 1rem;
  text-align: center;
  border-bottom: 3px solid #4f46e5;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
header h1 {
  font-size: 1.85rem;
  font-weight: 700;
  color: #312e81;
}
.theme-select {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid var(--border, #e2e8f0);
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  outline: none;
}
.dark-btn {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  padding: 7px 14px;
  border-radius: 10px;
  border: none;
  background: var(--accent-soft, #eef2ff);
  color: var(--accent, #4f46e5);
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.dark-btn:hover {
  background: var(--accent, #4f46e5);
  color: #ffffff;
}
@media (max-width: 540px) {
  header {
    flex-direction: column;
    gap: 12px;
    padding: 1.2rem 1rem;
  }
  .theme-select, .dark-btn {
    position: static;
    transform: none;
  }
  .header-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
}
.menu-column {
  max-width: 480px;
  width: 100%;
  margin: 1.2remrem auto;
  padding: 0 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}
.menu-item {
  display: block;
  background: #ffffff;
  color: #1e293b;
  text-decoration: none;
  font-size: 1.35rem;
  font-weight: 600;
  padding: 1.3rem 2rem;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #e2e8f0;
  transition: all 0.25s ease;
}
.menu-item:hover {
  transform: translateY(-3px);
}
footer {
  text-align: center;
  padding: 1.5rem 1rem;
  background: #ffffff;
  border-top: 1px solid #e2e8f0;
}
.tg-links a {
  display: inline-block;
  padding: 8px 18px;
  border-radius: 10px;
  text-decoration: none;
  margin: 4px;
  font-weight: 600;
  font-size: 0.95rem;
  transition: all 0.2s;
}
</style>
</head>
<body>

<header>
  <h1>Fizika va Matematika</h1>
  <div class="header-controls">
    <select id="theme-select" class="theme-select" title="Mavzuni tanlash">
      <option value="standart">🎨 Standart</option>
      <option value="qogoz">📜 Qog'oz</option>
      <option value="doska">🟩 Doska</option>
      <option value="kok">📘 Ko'k</option>
      <option value="minimalist">⚪ Minimalist</option>

    </select>
    <button id="dark-toggle" class="dark-btn">🌙 Tun</button>
  </div>
</header>
<div style="width:100%; max-width:960px; margin:0.8rem auto 0; padding:0 1rem;">
  <canvas id="owlCanvas" style="width:100%; height:130px; border-radius:16px; display:block; touch-action:none;"></canvas>
</div>

<div class="menu-column">
  <a href="fizika.html" class="menu-item">⚛️ Fizika</a>
  <a href="matematika.html" class="menu-item">📐 Matematika</a>
  <a href="blog.html" class="menu-item">✍️ Blog</a>
  <a href="kalkulyator.html" class="menu-item">🧮 Kalkulyator</a>
</div>

<footer>
  <div class="tg-links">
    <a href="https://t.me" target="_blank">@Phismath21</a>
    <a href="https://t.me" target="_blank">@Abdullayev2104</a>
  </div>
</footer>
<script>
(function() {
  const canvas = document.getElementById('owlCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  let W = 600, H = 130;
  const cell = 18;
  let cols = 0, rows = 0;
  let trail = new Array();

  const palette = new Array('#22c55e', '#a855f7', '#38bdf8', '#ec4899', '#eab308', '#6366f1');

  let owlX = 300, owlY = 65;
  let targetX = 300, targetY = 65;
  let wingPhase = 0;
  let autoTime = 0;
  let userActive = false;
  let activeTimer = 0;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = Math.max(300, Math.floor(rect.width));
    H = 130;
    canvas.width = W;
    canvas.height = H;
    cols = Math.ceil(W / cell);
    rows = Math.ceil(H / cell);
    if (!userActive) {
      owlX = W / 2;
      targetX = W / 2;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  function addTrail(x, y) {
    const c = Math.floor(x / cell);
    const r = Math.floor(y / cell);
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        if (Math.random() > 0.45) {
          const nc = c + dc, nr = r + dr;
          if (nc >= 0 && nc < cols && nr >= 0 && nr < rows) {
            const color = palette.at(Math.floor(Math.random() * palette.length));
            trail.push({ c: nc, r: nr, alpha: 0.9, color: color });
          }
        }
      }
    }
    if (trail.length > 140) trail.splice(0, trail.length - 140);
  }

  function handleMove(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    targetX = Math.max(30, Math.min(W - 30, x));
    targetY = Math.max(28, Math.min(H - 25, y));
    userActive = true;
    activeTimer = 180;
    addTrail(x, y);
  }

  canvas.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches.item(0);
    if (t) handleMove(t.clientX, t.clientY);
  }, { passive: true });
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches.item(0);
    if (t) handleMove(t.clientX, t.clientY);
  }, { passive: true });

  function drawOwl(x, y, flap, lookX, lookY) {
    ctx.save();
    ctx.translate(x, y);

    const wingY = Math.sin(flap) * 11;

    // Chap va o'ng qanotlar (qanot qoqish animatsiyasi)
    ctx.fillStyle = '#4f46e5';
    ctx.beginPath();
    ctx.moveTo(-14, 0);
    ctx.quadraticCurveTo(-34, -14 + wingY, -38, 4 + wingY);
    ctx.quadraticCurveTo(-24, 12, -12, 8);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.quadraticCurveTo(34, -14 + wingY, 38, 4 + wingY);
    ctx.quadraticCurveTo(24, 12, 12, 8);
    ctx.fill();

    // Tana
    ctx.fillStyle = '#312e81';
    ctx.beginPath();
    ctx.ellipse(0, 2, 16, 19, 0, 0, Math.PI * 2);
    ctx.fill();

    // Qorin qismi
    ctx.fillStyle = '#e0e7ff';
    ctx.beginPath();
    ctx.ellipse(0, 6, 10, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ko'zlar (oq doiralar)
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-6.5, -5, 6.5, 0, Math.PI * 2);
    ctx.arc(6.5, -5, 6.5, 0, Math.PI * 2);
    ctx.fill();

    // Kursor tomonga qaraydigan ko'z qorachiqlari
    const dx = Math.max(-2.5, Math.min(2.5, (lookX - x) * 0.03));
    const dy = Math.max(-2.5, Math.min(2.5, (lookY - y) * 0.03));
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(-6.5 + dx, -5 + dy, 3, 0, Math.PI * 2);
    ctx.arc(6.5 + dx, -5 + dy, 3, 0, Math.PI * 2);
    ctx.fill();

    // Tumshuq
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.moveTo(-3, 0);
    ctx.lineTo(3, 0);
    ctx.lineTo(0, 5);
    ctx.closePath();
    ctx.fill();

    // Akademik shapkacha (Magistr qalpog'i)
    ctx.fillStyle = '#1e1b4b';
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(18, -19);
    ctx.lineTo(0, -13);
    ctx.lineTo(-18, -19);
    ctx.closePath();
    ctx.fill();

    // Shapkacha popugi
    ctx.strokeStyle = '#f59e0b';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(14, -18);
    ctx.lineTo(16, -10);
    ctx.stroke();

    ctx.restore();
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    // Nozik fon to'ri (katakchalar)
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath(); ctx.moveTo(c * cell, 0); ctx.lineTo(c * cell, H); ctx.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * cell); ctx.lineTo(W, r * cell); ctx.stroke();
    }

    // Rangli piksel izlarini chizish va so'ndirish
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail.at(i);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.c * cell + 1, p.r * cell + 1, cell - 2, cell - 2);
      p.alpha -= 0.018;
      if (p.alpha <= 0) trail.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    // Boyo'g'lining avtonom suzishi (kursor tegmasa ham o'zi uchib yuradi)
    if (activeTimer > 0) {
      activeTimer--;
    } else {
      userActive = false;
      autoTime += 0.025;
      targetX = W / 2 + Math.sin(autoTime) * (W * 0.32);
      targetY = H / 2 + Math.cos(autoTime * 1.7) * 22;
      if (Math.random() > 0.65) addTrail(owlX, owlY);
    }

    // Silliq harakatlanish va qanot qoqish
    owlX += (targetX - owlX) * 0.06;
    owlY += (targetY - owlY) * 0.06;
    wingPhase += 0.22;

    drawOwl(owlX, owlY, wingPhase, targetX, targetY);
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
